name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

# `github.workflow` is the *calling* workflow's name — "CI" on a direct push,
# "Release" when release.yml calls this one. Keying on it is what keeps a push
# to main from cancelling the very run the release gate is waiting on: both
# fire on the same commit and the same ref, so any group they share makes one
# cancel the other, and the survivor reports "cancelled" as a failure.
#
# `github.event_name` cannot do this job: a called workflow inherits the
# caller's event, so it reads "push" in both cases.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend and frontend are independent packages with disjoint toolchains
  # (wrangler + vitest-node vs vite + tsc -b), so they run in parallel and a
  # failure in one still reports the other's result.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      # Regenerates CloudflareBindings from wrangler.jsonc, then fails if the
      # committed types are stale — a drifted binding type would otherwise
      # only surface at deploy time.
      #
      # This only works because cf-typegen passes --strict-vars=false. With
      # literal types, a var's *value* lands in the generated file, so a
      # developer with a .dev.vars gets different output than this runner and
      # the check fails on a difference that means nothing.
      - name: Worker types are up to date
        run: |
          pnpm cf-typegen
          if ! git diff --exit-code -- worker-configuration.d.ts; then
            echo "::error::worker-configuration.d.ts is stale — run 'pnpm cf-typegen' and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # `wrangler deploy --dry-run`: bundles the worker and validates the
      # config without touching Cloudflare.
      - name: Build
        run: pnpm build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # `tsc -b && vite build` — also typechecks shared/, which both packages
      # compile from source (there is no separate shared build step).
      - name: Build
        run: pnpm build

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      # Reports the actual result, not just "failed": a cancelled job means
      # something cancelled this run, which is a very different bug from a
      # test going red, and saying "checks failed" for it sends whoever reads
      # this straight to the wrong place.
      - name: Check status
        run: |
          status=0
          for pkg in backend:${{ needs.backend.result }} frontend:${{ needs.frontend.result }}; do
            name=${pkg%%:*}
            result=${pkg#*:}
            case "$result" in
              success)   echo "✅ ${name}: passed." ;;
              cancelled) echo "::error::${name} was cancelled — another run superseded this one."; status=1 ;;
              skipped)   echo "::error::${name} never ran."; status=1 ;;
              *)         echo "::error::${name} checks failed (${result})."; status=1 ;;
            esac
          done
          exit $status
