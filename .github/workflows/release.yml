name: Release

on:
  push:
    branches: [main]
    # Only the root package.json: it holds the single version for the whole
    # service, so a release is exactly "the version number changed". Watching
    # CHANGELOG.md too would fire the whole gate every time the Unreleased
    # section is edited, which is most pushes.
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.tag_exists == 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      # package.json also changes when a script is edited, so the path filter
      # alone is not "the version went up". The tag is the real record of what
      # shipped: if it exists, this push changed something else.
      - name: Check whether this version was already released
        id: check_tag
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "⚠️  Tag ${{ steps.version.outputs.tag }} already exists — nothing to release."
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Tag ${{ steps.version.outputs.tag }} is new."
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A release whose notes would be empty is a mistake, not a release: the
      # CHANGELOG section is the release notes.
      - name: Require a CHANGELOG entry for this version
        if: steps.check_tag.outputs.tag_exists == 'false'
        run: |
          if ! grep -q "^## \[${{ steps.version.outputs.version }}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${{ steps.version.outputs.version }}]' section."
            exit 1
          fi
          echo "✅ CHANGELOG entry found."

  # The same jobs a push to main runs, on this exact commit. Reused rather than
  # copied, so the release gate cannot drift from CI.
  ci:
    name: CI
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml

  # Only runs once `ci` has succeeded on this commit — nothing is tagged or
  # published before the gate is green.
  publish:
    name: Build, Tag and Release
    needs: [verify, ci]
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install:all

      # CI already ran every check; this build only produces the artifacts the
      # release attaches.
      - name: Build
        run: pnpm build

      # The frontend bundle is what Pages serves; attaching it makes a release
      # reproducible and lets an operator diff or roll back without rebuilding.
      - name: Package release assets
        run: |
          TAG=${{ needs.verify.outputs.tag }}
          mkdir -p release

          tar -czf "release/orbinum-telemetry-frontend-${TAG}.tar.gz" -C frontend dist

          # Config that determines how the worker behaves in production.
          tar -czf "release/orbinum-telemetry-worker-config-${TAG}.tar.gz" \
            backend/wrangler.jsonc backend/worker-configuration.d.ts

          (cd release && sha256sum ./*.tar.gz > "checksums-${TAG}.txt")
          ls -lh release/
          cat "release/checksums-${TAG}.txt"

      - name: Create release notes
        run: |
          # The section for the version being released, by exact heading —
          # matching "the first ## [" instead would pick up [Unreleased] and
          # produce empty notes.
          awk -v tag="## [${{ needs.verify.outputs.version }}]" '
            index($0, tag) == 1  { flag = 1; next }
            flag && /^## \[/     { exit }
            flag && /^\[[^]]+\]:/{ exit }   # link definitions end the section
            flag
          ' CHANGELOG.md > release_notes_body.md

          {
            echo "## ${{ needs.verify.outputs.tag }}"
            echo ""
            if [ -s release_notes_body.md ]; then
              cat release_notes_body.md
            else
              echo "- Release generated from CI."
            fi
            echo ""
            echo "## Deploy"
            echo ""
            echo '```sh'
            echo "pnpm deploy:back    # worker → telemetry.orbinum.io"
            echo "pnpm deploy:front   # Pages  → telemetry.orbinum.network"
            echo '```'
            echo ""
            echo "## Release Assets"
            echo ""
            echo "- \`orbinum-telemetry-frontend-${{ needs.verify.outputs.tag }}.tar.gz\` — built UI, as served by Pages"
            echo "- \`orbinum-telemetry-worker-config-${{ needs.verify.outputs.tag }}.tar.gz\` — wrangler config and binding types"
            echo "- \`checksums-${{ needs.verify.outputs.tag }}.txt\` — SHA-256 checksums"
          } > release_notes.md

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.verify.outputs.tag }}" -m "Release ${{ needs.verify.outputs.tag }}"
          git push origin "${{ needs.verify.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: Release ${{ needs.verify.outputs.tag }}
          files: |
            release/*.tar.gz
            release/*.txt
          body_path: release_notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Deploys only what a tagged release produced: `needs` reaches back through
  # publish → ci → verify, so nothing reaches Cloudflare until every check on
  # this exact commit is green and the tag exists.
  #
  # The worker goes first. It owns the wire contract the UI compiles against,
  # so a UI serving a payload its worker does not yet send is the one ordering
  # that breaks; the reverse merely delays a feature.
  deploy:
    name: Deploy to Cloudflare
    needs: [verify, ci, publish]
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: pnpm install:all

      - name: Deploy worker
        run: pnpm deploy:back
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `--branch main` is what marks this a production deploy. Without a Git
      # integration Pages has no branch to infer, and an unmarked deploy lands
      # as a preview: a green run that never reaches the live domain.
      - name: Deploy Pages
        working-directory: frontend
        run: pnpm build && pnpm exec wrangler pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
