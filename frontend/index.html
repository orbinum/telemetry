<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/isotipo-black-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/isotipo-black-192.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Orbinum Telemetry - Live Network Node Monitoring</title>

    <meta
      name="description"
      content="Real-time telemetry for Orbinum network nodes: block height, finalized blocks, peers, transaction pool, propagation time, node versions and locations."
    />

    <meta
      name="keywords"
      content="Orbinum, telemetry, node monitoring, blockchain nodes, validators, block height, network status, Substrate, live dashboard"
    />

    <meta name="author" content="Orbinum Network" />

    <meta
      name="robots"
      content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1"
    />

    <link rel="canonical" href="https://telemetry.orbinum.network" />

    <!-- Theme -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Orbinum Telemetry" />
    <meta name="apple-mobile-web-app-title" content="Orbinum Telemetry" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://telemetry.orbinum.network" />
    <meta property="og:site_name" content="Orbinum Telemetry" />
    <meta property="og:locale" content="en_US" />

    <meta property="og:title" content="Orbinum Telemetry - Live Network Node Monitoring" />

    <meta
      property="og:description"
      content="Real-time monitoring of Orbinum network nodes: blocks, peers, propagation and locations."
    />

    <meta property="og:image" content="https://telemetry.orbinum.network/banner.png" />

    <meta property="og:image:width" content="1200" />

    <meta property="og:image:height" content="630" />

    <meta property="og:image:alt" content="Orbinum Telemetry" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Orbinum Telemetry - Live Network Node Monitoring" />

    <meta
      name="twitter:description"
      content="Real-time monitoring of Orbinum network nodes: blocks, peers, propagation and locations."
    />

    <meta name="twitter:image" content="https://telemetry.orbinum.network/banner.png" />

    <meta name="twitter:creator" content="@orbinumnetwork" />

    <meta name="twitter:site" content="@orbinumnetwork" />

    <!-- Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Orbinum Network",
        "url": "https://orbinum.network",
        "logo": "https://orbinum.network/isotipo-black-png",
        "image": "https://orbinum.network/isotipo-black-png",
        "description": "Blockchain Privacy Infrastructure built on Substrate with EVM support.",
        "sameAs": [
          "https://twitter.com/orbinumnetwork",
          "https://github.com/orbinum",
          "https://medium.com/@orbinumnetwork"
        ]
      }
    </script>

    <!-- Website -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Orbinum Telemetry",
        "url": "https://telemetry.orbinum.network"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
